<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>PropAI — Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f1ea; color: #1b2520; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #dce2da; border-radius: 18px; background: #fbfaf6; box-shadow: 0 18px 50px rgba(31, 43, 36, .1); }
      .mark { color: #128653; font-size: 18px; font-weight: 800; letter-spacing: -.04em; }
      h1 { margin: 28px 0 10px; font-size: 28px; line-height: 1.1; letter-spacing: -.03em; }
      p { margin: 0; color: #52605a; line-height: 1.55; }
      button { margin-top: 24px; min-height: 44px; border: 0; border-radius: 11px; padding: 0 18px; background: #128653; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid rgba(18, 134, 83, .35); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">PropAI</div>
      <h1>You’re offline</h1>
      <p>Reconnect to browse fresh properties from active broker conversations.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
